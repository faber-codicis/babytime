# Monatlich gebündelte Updates, damit es nicht laut wird. Sicherheitsupdates kommen sofort.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      alle:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Große Sprünge (z. B. TypeScript 7) brechen oft Peer-Abhängigkeiten wie typescript-eslint.
      # Die kommen bewusst von Hand, nicht automatisch.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
