name: Fehler melden · Bug report
description: Etwas funktioniert nicht wie erwartet. Something does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Danke! Bitte **keine Gesundheitsdaten und keine echten Babynamen** in Text oder Screenshots.
        Thanks! Please **no health data and no real baby names** in text or screenshots.
  - type: textarea
    id: was
    attributes:
      label: Was ist passiert? · What happened?
      description: Und was hättest du erwartet? · And what did you expect?
    validations:
      required: true
  - type: textarea
    id: schritte
    attributes:
      label: Schritte zum Nachstellen · Steps to reproduce
      placeholder: |
        1. Heute → Stillen
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Steht oben rechts auf „Heute“ (z. B. v0.16.0). · Shown top right on "Today".
    validations:
      required: true
  - type: input
    id: geraet
    attributes:
      label: Gerät und Browser · Device and browser
      placeholder: z. B. iPhone 15, iOS 26, installiert · e.g. Pixel 8, Chrome, installed
    validations:
      required: true
