# Prüfen und ausliefern (seit 0.15.1).
# - Merge bzw. Push auf main: alle Prüfungen aus dem README, danach `wrangler deploy`.
# - Knopf „Run workflow“ (auch in der GitHub-App): denselben Stand erneut prüfen und ausliefern.
# Schlägt eine Prüfung fehl, wird nichts ausgeliefert. Der Merge ist die Freigabe der Besitzerin.
# Secrets im Repo: CLOUDFLARE_API_TOKEN (nur „Workers Scripts: Edit“) und CLOUDFLARE_ACCOUNT_ID.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nie zwei Deploys gleichzeitig; ein laufender wird nicht abgebrochen.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Europe/Vienna
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck, Lint, Unit-Tests
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Browser für E2E
        run: npx playwright install --with-deps chromium webkit

      - name: E2E-Tests
        run: npm run test:e2e -- --trace off

      - name: Audit (hohe und kritische Funde stoppen)
        run: npm audit --omit=dev --audit-level=high

      - name: Build und externe URLs
        run: |
          npm run build
          npm run check:external

      - name: Ausliefern
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
