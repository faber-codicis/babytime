<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#B04A63" />
    <!-- Saved dark design is applied before the first paint (external file: CSP allows no inline script). -->
    <script src="/theme-init.js"></script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Baby Time" />
    <meta name="description" content="Stillen, Windeln und Schlaf im Blick – auch um 3 Uhr nachts." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Baby Time</title>
    <style>
      /* Critical splash styles: visible before any JS runs. */
      html, body { margin: 0; }
      .splash {
        position: fixed; inset: 0; z-index: 100; overflow: hidden;
        display: flex; flex-direction: column; align-items: center;
        background: #B04A63; color: #fff;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
        padding: env(safe-area-inset-top) 16px max(28px, env(safe-area-inset-bottom));
        box-sizing: border-box;
        transition: opacity 180ms ease-out;
      }
      .splash.is-hidden { opacity: 0; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) { .splash { transition: none; } }
      .splash-blob { position: absolute; border-radius: 50%; background: rgba(255, 255, 255, 0.08); }
      .splash-blob--a { width: 300px; height: 300px; left: -90px; top: -110px; }
      .splash-blob--b { width: 260px; height: 260px; right: -100px; bottom: 9%; }
      .splash-dot { position: absolute; border-radius: 50%; }
      .splash-main {
        position: relative; flex: 1; display: flex; flex-direction: column;
        align-items: center; justify-content: center; padding-bottom: 12vh; text-align: center;
      }
      .splash-logo { width: 300px; height: 300px; max-width: 78vw; max-height: 78vw; }
      .splash-title { margin: 28px 0 0; font-size: 46px; font-weight: 800; letter-spacing: -2px; line-height: 1.05; }
      .splash-tagline { margin: 8px 0 0; font-size: 17px; font-weight: 500; }
      .splash-foot { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; }
      .splash-loader { display: flex; gap: 8px; }
      .splash-loader span { width: 10px; height: 10px; border-radius: 50%; background: #fff; animation: splash-pulse 900ms ease-in-out infinite; }
      .splash-loader span:nth-child(2) { opacity: 0.6; animation-delay: 150ms; }
      .splash-loader span:nth-child(3) { opacity: 0.35; animation-delay: 300ms; }
      @keyframes splash-pulse { 50% { transform: scale(0.7); } }
      @media (prefers-reduced-motion: reduce) { .splash-loader span { animation: none; } }
      .splash-version { margin: 0; font-size: 13px; font-weight: 600; }
      /* Dark design switched on: muted splash, no bright rosé flash at 3 a.m. */
      html[data-theme='dark'], html[data-theme='dark'] body { background: #150D10; }
      html[data-theme='dark'] .splash { background: #150D10; color: #F6C2BA; }
      html[data-theme='dark'] .splash-blob { background: rgba(246, 194, 186, 0.06); }
      html[data-theme='dark'] .splash-logo { opacity: 0.85; }
      html[data-theme='dark'] .splash-loader span { background: #F6C2BA; }
    </style>
  </head>
  <body>
    <div id="splash" class="splash">
      <div class="splash-blob splash-blob--a" aria-hidden="true"></div>
      <div class="splash-blob splash-blob--b" aria-hidden="true"></div>
      <span class="splash-dot" aria-hidden="true" style="width:14px;height:14px;right:13%;top:14%;background:#F7DCE2"></span>
      <span class="splash-dot" aria-hidden="true" style="width:9px;height:9px;left:10%;top:25%;background:#FCE3D6"></span>
      <span class="splash-dot" aria-hidden="true" style="width:8px;height:8px;right:11%;top:56%;background:#FCE3D6"></span>
      <span class="splash-dot" aria-hidden="true" style="width:11px;height:11px;left:14%;top:64%;background:#E9E3F3"></span>
      <div class="splash-main">
        <svg class="splash-logo" viewBox="0 0 300 300" aria-hidden="true">
          <g stroke="#F7DCE2" stroke-opacity="0.75" stroke-linecap="round">
            <g stroke-width="5">
              <line x1="150" y1="4" x2="150" y2="24" />
              <line x1="150" y1="4" x2="150" y2="24" transform="rotate(90 150 150)" />
              <line x1="150" y1="4" x2="150" y2="24" transform="rotate(180 150 150)" />
              <line x1="150" y1="4" x2="150" y2="24" transform="rotate(270 150 150)" />
            </g>
            <g stroke-width="3.5">
              <line x1="150" y1="8" x2="150" y2="19" transform="rotate(30 150 150)" />
              <line x1="150" y1="8" x2="150" y2="19" transform="rotate(60 150 150)" />
              <line x1="150" y1="8" x2="150" y2="19" transform="rotate(120 150 150)" />
              <line x1="150" y1="8" x2="150" y2="19" transform="rotate(150 150 150)" />
              <line x1="150" y1="8" x2="150" y2="19" transform="rotate(210 150 150)" />
              <line x1="150" y1="8" x2="150" y2="19" transform="rotate(240 150 150)" />
              <line x1="150" y1="8" x2="150" y2="19" transform="rotate(300 150 150)" />
              <line x1="150" y1="8" x2="150" y2="19" transform="rotate(330 150 150)" />
            </g>
          </g>
          <g transform="translate(150 150) scale(1.58) translate(-100 -100)">
            <circle cx="100" cy="100" r="74" fill="#F7DCE2" />
            <circle cx="44" cy="104" r="9" fill="#F5C4AE" />
            <circle cx="156" cy="104" r="9" fill="#F5C4AE" />
            <circle cx="100" cy="100" r="58" fill="#FBD9C7" />
            <path d="M100 42 Q92 30 102 26 Q112 24 108 34" fill="none" stroke="#3A2630" stroke-width="4" stroke-linecap="round" />
            <circle cx="68" cy="112" r="9" fill="#F4A6A0" opacity="0.7" />
            <circle cx="132" cy="112" r="9" fill="#F4A6A0" opacity="0.7" />
            <path d="M68 92 Q76 82 84 92" fill="none" stroke="#3A2630" stroke-width="4.5" stroke-linecap="round" />
            <path d="M116 92 Q124 82 132 92" fill="none" stroke="#3A2630" stroke-width="4.5" stroke-linecap="round" />
            <path d="M80 112 Q100 140 120 112 Z" fill="#8E2F47" stroke="#8E2F47" stroke-width="3" stroke-linejoin="round" />
            <path d="M90 123 Q100 117 110 123 Q100 131 90 123 Z" fill="#F08A9B" />
          </g>
        </svg>
        <h1 class="splash-title">Baby Time</h1>
        <p class="splash-tagline">Alles im Blick, auch um 3&nbsp;Uhr nachts.</p>
      </div>
      <div class="splash-foot">
        <div class="splash-loader" aria-hidden="true"><span></span><span></span><span></span></div>
        <p class="splash-version">Version %APP_VERSION%</p>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
